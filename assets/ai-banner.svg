<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Yigex — AI, computing and creative technology</title>
  <desc id="desc">Dark graphite banner with electric blue and violet computational forms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c13"/>
      <stop offset="0.56" stop-color="#111724"/>
      <stop offset="1" stop-color="#0b0c13"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#9eb5cb"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48c6ff"/>
      <stop offset="0.58" stop-color="#697aff"/>
      <stop offset="1" stop-color="#ba56d8"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#375fc6" stop-opacity="0.43"/>
      <stop offset="1" stop-color="#375fc6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#9cc4ff" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="26" fill="url(#grid)"/>
  <circle cx="977" cy="165" r="242" fill="url(#halo)"/>
  <path d="M30 29H1170M30 301H1170" stroke="#a6c9ff" stroke-opacity="0.16"/>
  <path d="M30 29V301M1170 29V301" stroke="#a6c9ff" stroke-opacity="0.16"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8eabca" font-size="12" letter-spacing="2.4">
    <text x="66" y="65">BRUCEXCLUDING / PROFILE INTERFACE</text>
    <text x="66" y="286">SYSTEM ONLINE</text>
    <text x="314" y="286">AI · COMPUTE · CREATIVE TECH</text>
    <text x="1035" y="286">001 / 001</text>
