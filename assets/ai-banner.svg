  <path d="M616 103H771M616 119H727M616 135H749M616 151H697M616 167H737" stroke="#669acb" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round"/>
  <rect x="30" y="29" width="1140" height="272" rx="12" fill="none" stroke="#bad7ff" stroke-opacity="0.08"/>
