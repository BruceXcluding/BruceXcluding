  <circle cx="47" cy="61" r="5" fill="#52c8ff"/>
  <circle cx="47" cy="282" r="5" fill="#52c8ff"/>
  <text x="62" y="198" fill="url(#headline)" font-family="Arial, Helvetica, sans-serif" font-size="111" font-weight="900" letter-spacing="-10">YIGEX</text>
  <path d="M64 218H540" stroke="url(#signal)" stroke-width="4" stroke-linecap="round"/>

