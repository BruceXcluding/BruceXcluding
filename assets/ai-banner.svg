    <circle r="93" fill="none" stroke="#75aaff" stroke-opacity="0.27"/>
    <circle r="62" fill="none" stroke="url(#signal)" stroke-opacity="0.68" stroke-width="2"/>
    <circle r="28" fill="#101d3a" stroke="#65bbff" stroke-opacity="0.7"/>
    <circle r="11" fill="#75caff" filter="url(#glow)"/>
    <circle r="5" fill="#b5e9ff"/>
    <path d="M-122 0H-33M33 0H122M0-122V-33M0 33V122M-87-87L-23-23M23 23L87 87M87-87L23-23M-23 23L-87 87" stroke="url(#signal)" stroke-width="2" stroke-opacity="0.6"/>
    <g fill="#9cdbff">
